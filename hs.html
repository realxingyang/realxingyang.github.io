<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>专注任意键 | 锁定单键CPS测试</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }

        body {
            background: radial-gradient(circle at 20% 30%, #0a0f1e, #03060c);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', 'Poppins', 'Inter', system-ui, -apple-system, BlinkMacSystemFont, 'Roboto', sans-serif;
            padding: 20px;
            margin: 0;
        }

        .cps-container {
            max-width: 720px;
            width: 100%;
            background: rgba(12, 18, 32, 0.75);
            backdrop-filter: blur(16px);
            border-radius: 72px;
            box-shadow: 0 30px 50px rgba(0, 0, 0, 0.5), 0 0 0 1px rgba(120, 160, 255, 0.2);
            padding: 28px 26px 40px;
            transition: all 0.2s;
            text-align: center;
        }

        h1 {
            font-size: 2.2rem;
            font-weight: 800;
            background: linear-gradient(125deg, #ffffff, #a5c0ff);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
            letter-spacing: -0.5px;
            margin-bottom: 6px;
        }

        .subhead {
            color: #8faaee;
            font-weight: 500;
            margin-bottom: 28px;
            font-size: 0.85rem;
            letter-spacing: 1px;
            border-bottom: 1px dashed #2e3b66;
            display: inline-block;
            padding-bottom: 6px;
        }

        .stats-grid {
            background: #050a17aa;
            border-radius: 56px;
            padding: 18px 16px;
            margin-bottom: 28px;
            display: flex;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 14px;
            border: 1px solid #2a3a6e;
        }

        .stat-box {
            flex: 1;
            background: #00000040;
            border-radius: 44px;
            padding: 12px 6px;
            text-align: center;
            transition: all 0.2s;
            backdrop-filter: blur(4px);
        }

        .stat-label {
            font-size: 0.75rem;
            text-transform: uppercase;
            font-weight: 600;
            color: #b2c7ff;
            letter-spacing: 1px;
            margin-bottom: 8px;
        }

        .stat-number {
            font-size: 2.3rem;
            font-weight: 800;
            color: white;
            line-height: 1;
            font-family: 'Monaco', 'Menlo', monospace;
            text-shadow: 0 2px 6px black;
        }

        .unit {
            font-size: 0.85rem;
            font-weight: 500;
            color: #95abdf;
            margin-left: 3px;
        }

        .click-mega-zone {
            background: linear-gradient(145deg, #1e2c54, #0b1126);
            margin: 20px 0 26px;
            border-radius: 68px;
            padding: 56px 20px;
            cursor: pointer;
            transition: all 0.08s linear;
            box-shadow: 0 22px 32px -10px black, inset 0 1px 2px rgba(255, 255, 255, 0.2);
            border: 1px solid #5c7ed6;
            position: relative;
        }

        .click-mega-zone:active {
            transform: scale(0.97);
            background: linear-gradient(145deg, #152249, #070c1c);
            box-shadow: 0 10px 20px -5px black;
        }

        .click-mega-zone.disabled {
            cursor: not-allowed;
            opacity: 0.7;
            filter: grayscale(0.08);
            transform: none;
        }

        .click-mega-zone.disabled:active {
            transform: scale(1);
        }

        .zone-content {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
        }

        .zone-icon {
            font-size: 4.8rem;
            filter: drop-shadow(0 6px 8px #00000070);
            transition: 0.05s linear;
        }

        .zone-text {
            font-size: 1.2rem;
            font-weight: 600;
            background: #00000066;
            backdrop-filter: blur(12px);
            padding: 8px 22px;
            border-radius: 60px;
            color: #f0f3ff;
            letter-spacing: 1px;
        }

        .duration-bar {
            margin: 8px 0 20px;
            display: flex;
            justify-content: center;
            gap: 14px;
            flex-wrap: wrap;
        }

        .duration-pill {
            background: #0b1022;
            padding: 8px 22px;
            border-radius: 48px;
            color: #b7ceff;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
            border: 1px solid #314575;
            font-size: 0.9rem;
        }

        .duration-pill.active {
            background: #3f62bc;
            color: white;
            border-color: #aac6ff;
            box-shadow: 0 0 12px #3f62bc;
        }

        .duration-pill.disabled-pill {
            opacity: 0.5;
            pointer-events: none;
            cursor: default;
        }

        .button-group {
            display: flex;
            gap: 20px;
            justify-content: center;
            margin: 12px 0 15px;
        }

        .cps-btn {
            border: none;
            font-weight: 700;
            padding: 12px 28px;
            border-radius: 60px;
            font-size: 1rem;
            cursor: pointer;
            transition: 0.2s;
            background: #19233f;
            color: #eef3ff;
            box-shadow: 0 6px 14px rgba(0, 0, 0, 0.4);
            font-family: inherit;
        }

        .cps-btn-secondary {
            background: #202d4ecc;
            border: 1px solid #4b608f;
        }

        .cps-btn-secondary:hover:not(:disabled) {
            background: #2f3f6b;
            transform: translateY(-2px);
        }

        .cps-btn:active {
            transform: translateY(1px);
        }

        .result-message {
            margin-top: 24px;
            background: #00000055;
            border-radius: 60px;
            padding: 14px 16px;
            font-weight: 500;
            backdrop-filter: blur(5px);
            font-size: 0.95rem;
            transition: 0.1s;
            color: #cadaff;
        }
        
        .rating-badge {
            display: inline-block;
            background: rgba(0,0,0,0.5);
            border-radius: 40px;
            padding: 4px 14px;
            margin-top: 8px;
            font-weight: bold;
            letter-spacing: 1px;
        }
        
        .locked-key-badge {
            display: inline-block;
            background: #2a3f6e;
            border-radius: 60px;
            padding: 4px 14px;
            font-family: monospace;
            font-weight: bold;
            font-size: 1.1rem;
            margin-top: 6px;
            border: 1px solid #8aadff;
            box-shadow: 0 0 5px #3f62bc;
        }
        
        footer {
            font-size: 0.7rem;
            color: #5e74a3;
            margin-top: 20px;
        }

        @media (max-width: 520px) {
            .cps-container {
                padding: 20px 18px 32px;
            }
            .stat-number {
                font-size: 1.8rem;
            }
            .click-mega-zone {
                padding: 38px 12px;
            }
            .zone-icon {
                font-size: 3.6rem;
            }
        }
    </style>
</head>
<body>
<div class="cps-container">
    <h1>🔒 单键专注挑战 🔒</h1>
    <div class="subhead">按下第一个键后锁定该键 | 只记录同一键的点击 | 防止乱按作弊</div>

    <!-- 实时面板 -->
    <div class="stats-grid">
        <div class="stat-box">
            <div class="stat-label">⏱️ 剩余</div>
            <div class="stat-number"><span id="timerDisplay">0.0</span><span class="unit">s</span></div>
        </div>
        <div class="stat-box">
            <div class="stat-label">🖱️ 有效点击数</div>
            <div class="stat-number"><span id="clickDisplay">0</span></div>
        </div>
        <div class="stat-box">
            <div class="stat-label">📈 实时CPS</div>
            <div class="stat-number"><span id="cpsDisplay">0.00</span><span class="unit">/s</span></div>
        </div>
    </div>

    <!-- 点击核心区（鼠标+键盘都能触发） -->
    <div id="clickZone" class="click-mega-zone">
        <div class="zone-content">
            <div class="zone-icon">🔒⌨️</div>
            <div class="zone-text" id="zoneStatusMsg">⚡ 按任意键 或 点击开始 ⚡</div>
        </div>
    </div>

    <!-- 显示当前锁定的键 -->
    <div id="lockedKeyDisplay" style="min-height: 48px; margin-bottom: 8px;"></div>

    <!-- 时长选择器 -->
    <div class="duration-bar" id="durationSelector">
        <div data-dur="3" class="duration-pill">3 秒</div>
        <div data-dur="5" class="duration-pill active">5 秒</div>
        <div data-dur="10" class="duration-pill">10 秒</div>
    </div>

    <!-- 辅助按钮 -->
    <div class="button-group">
        <button id="resetButton" class="cps-btn cps-btn-secondary">🔄 重置 / 新测试</button>
    </div>

    <!-- 结果显示区 + 动态评价 -->
    <div id="resultMessage" class="result-message">
        💡 规则：测试开始后，你按下的「第一个键」将被锁定，后续只有按同一个键才会计数。<br>
        🚫 按下其他键无效且会有提示，防止乱按刷次数。鼠标点击同样遵循锁定规则（首次点击即锁定鼠标）。
    </div>
    <footer>✨ 键盘任意键+鼠标 | 测试结束冷却1秒 | 锁定单键确保公平 ✨</footer>
</div>

<script>
    // ---------- DOM 元素 ----------
    const clickZone = document.getElementById('clickZone');
    const timerDisplay = document.getElementById('timerDisplay');
    const clickDisplay = document.getElementById('clickDisplay');
    const cpsDisplay = document.getElementById('cpsDisplay');
    const resetBtn = document.getElementById('resetButton');
    const resultMsgDiv = document.getElementById('resultMessage');
    const zoneStatusMsg = document.getElementById('zoneStatusMsg');
    const durationPills = document.querySelectorAll('.duration-pill');
    const lockedKeyDisplay = document.getElementById('lockedKeyDisplay');

    // ---------- 状态变量 ----------
    let isTesting = false;          // 是否正在测试中（倒计时进行中，可计数）
    let isCooldown = false;         // 是否处于冷却期（测试结束后1秒内不可开始新测试）
    let clickCount = 0;             // 当前测试周期内有效点击数
    let testDurationSec = 5;        // 当前测试时长
    let selectedDuration = 5;       // 用户选择时长
    
    // 锁定键相关
    let lockedInputType = null;     // 'keyboard' 或 'mouse'
    let lockedKeyValue = null;      // 键盘锁定的具体键名（如 'a', 'Space'）或者鼠标标识 'mouse'
    let isLocked = false;           // 是否已经锁定了输入方式
    
    // 存储最后一次完成的测试结果
    let lastFinalCPS = 0;
    let lastClickTotal = 0;
    let lastRatingHTML = '';

    let startTimestamp = 0;          // performance起始时间
    let animationFrameId = null;     
    let cooldownTimer = null;        // 冷却结束定时器

    // ---------- 评级函数 ----------
    function getRatingByCPS(cps) {
        if (cps < 3) {
            return { 
                title: "🐢 树懒级", 
                desc: "慢如树懒，需要更多练习！试试加快手速吧～",
                emoji: "🦥",
                color: "#8e9eae",
                glow: false
            };
        } else if (cps < 5) {
            return { 
                title: "📝 凡人级", 
                desc: "普通人类水准，稳定发挥，再加油进化为快枪手！",
                emoji: "🧑",
                color: "#b0c4de",
                glow: false
            };
        } else if (cps < 7.5) {
            return { 
                title: "⚡ 敏捷级", 
                desc: "手速不错！已经超越大部分玩家，继续突破！",
                emoji: "⚡",
                color: "#7fb4ff",
                glow: false
            };
        } else if (cps < 10) {
            return { 
                title: "🔥 狂点击级", 
                desc: "指尖狂魔！APM高手，让朋友刮目相看吧。",
                emoji: "🔥",
                color: "#ffaa66",
                glow: true
            };
        } else if (cps < 13) {
            return { 
                title: "💀 幽冥单击王", 
                desc: "超越人类极限！你是隐藏在人群中的点击刺客。",
                emoji: "💀",
                color: "#ff7b72",
                glow: true
            };
        } else {
            return { 
                title: "⚡ 闪电侠 ⚡", 
                desc: "传说级手速！每秒超过13次，非人的反应速度！",
                emoji: "🏆",
                color: "#ffd966",
                glow: true
            };
        }
    }
    
    // 生成评级HTML
    function generateRatingHTML(finalCPS, clickTotal) {
        const rating = getRatingByCPS(finalCPS);
        return `
            <div style="margin-top: 6px;">
                <span style="font-size:1.3rem; margin-right:6px;">${rating.emoji}</span>
                <span class="rating-badge" style="background: #000000aa; color: ${rating.color}; border-left: 3px solid ${rating.color};">
                    ✨ ${rating.title} ✨
                </span>
            </div>
            <div style="font-size:0.85rem; margin-top: 10px; background: #00000040; border-radius: 28px; padding: 8px 12px;">
                🎯 ${rating.desc}<br>
                📊 最终CPS: <strong style="color:${rating.color}; font-size:1.1rem;">${finalCPS.toFixed(2)}</strong>  |  总有效点击: ${clickTotal}
            </div>
        `;
    }
    
    // 更新锁定键显示UI
    function updateLockedDisplay() {
        if (!isLocked) {
            lockedKeyDisplay.innerHTML = '';
            return;
        }
        if (lockedInputType === 'keyboard') {
            let displayKey = lockedKeyValue;
            if (displayKey === ' ') displayKey = 'Space';
            if (displayKey.length === 1) displayKey = displayKey.toUpperCase();
            lockedKeyDisplay.innerHTML = `<div class="locked-key-badge">🔒 当前锁定键: [ ${displayKey} ] (只有此键有效)</div>`;
        } else if (lockedInputType === 'mouse') {
            lockedKeyDisplay.innerHTML = `<div class="locked-key-badge">🖱️ 当前锁定: 鼠标点击 (只有鼠标点击有效)</div>`;
        }
    }
    
    // 更新实时UI
    function updateUI() {
        if (isTesting && startTimestamp > 0) {
            const now = performance.now();
            const elapsed = (now - startTimestamp) / 1000;
            let remaining = testDurationSec - elapsed;
            if (remaining < 0) remaining = 0;
            timerDisplay.innerText = remaining.toFixed(2);
            
            let instantCPS = 0;
            if (elapsed > 0 && clickCount > 0) {
                instantCPS = clickCount / elapsed;
            }
            cpsDisplay.innerText = instantCPS.toFixed(2);
            clickDisplay.innerText = clickCount;
            
            if (remaining <= 0.0 && isTesting) {
                endTestWithCooldown();
            }
        }
    }
    
    // 结束测试 + 冷却1秒 + 保留结果
    function endTestWithCooldown() {
        if (!isTesting) return;
        
        if (animationFrameId) {
            cancelAnimationFrame(animationFrameId);
            animationFrameId = null;
        }
        
        const now = performance.now();
        const elapsedTotal = (now - startTimestamp) / 1000;
        let finalCPS = 0;
        if (elapsedTotal > 0 && clickCount > 0) {
            finalCPS = clickCount / elapsedTotal;
        }
        
        lastFinalCPS = finalCPS;
        lastClickTotal = clickCount;
        lastRatingHTML = generateRatingHTML(finalCPS, clickCount);
        
        timerDisplay.innerText = "0.00";
        cpsDisplay.innerText = finalCPS.toFixed(2);
        clickDisplay.innerText = clickCount;
        
        resultMsgDiv.innerHTML = `
            <div style="display:flex; flex-direction:column; gap:6px;">
                <div>🎉 测试完成！ 🎉</div>
                ${lastRatingHTML}
                <div style="font-size:0.75rem; margin-top:6px;">⏰ 冷却1秒中，结束后可开始新测试（结果将保留至重置）</div>
            </div>
        `;
        
        isTesting = false;
        isCooldown = true;
        clickZone.classList.add('disabled');
        zoneStatusMsg.innerHTML = '⏳ 冷却中 (1秒) ⏳';
        enableDurationChips(false);
        
        if (cooldownTimer) clearTimeout(cooldownTimer);
        cooldownTimer = setTimeout(() => {
            isCooldown = false;
            cooldownTimer = null;
            clickZone.classList.remove('disabled');
            zoneStatusMsg.innerHTML = '⚡ 按任意键 或 点击开始新测试 ⚡';
            enableDurationChips(true);
            // 不清除锁定显示，但重置后锁定会被清除，因为fullReset才会清除；但是冷却结束不清除锁定（测试已结束，锁定无意义，但是为了体验，显示提示新测试会重置锁定）
            if (lastRatingHTML) {
                resultMsgDiv.innerHTML = `
                    <div style="display:flex; flex-direction:column; gap:6px;">
                        <div>🎉 上一次测试结果 🎉</div>
                        ${lastRatingHTML}
                        <div style="font-size:0.75rem; margin-top:6px;">✅ 冷却结束，按任意键或点击开始新测试（新测试将锁定第一个按下的键）</div>
                    </div>
                `;
            } else {
                resultMsgDiv.innerHTML = '✅ 冷却结束，按任意键或点击中央区域开始新测试！';
            }
            // 冷却结束后清除锁定显示（因为没测试了，且下次新测试会重新锁定）
            isLocked = false;
            lockedInputType = null;
            lockedKeyValue = null;
            updateLockedDisplay();
        }, 1000);
    }
    
    // 开始全新测试 (重置锁定，重新开始)
    function startNewTest(initialInputType, initialKeyValue = null) {
        if (isTesting || isCooldown) return;
        
        if (animationFrameId) {
            cancelAnimationFrame(animationFrameId);
            animationFrameId = null;
        }
        
        // 重置所有计数和锁定状态
        clickCount = 0;
        testDurationSec = selectedDuration;
        isLocked = true;  // 立即锁定
        lockedInputType = initialInputType;
        if (initialInputType === 'keyboard') {
            lockedKeyValue = initialKeyValue;
        } else {
            lockedKeyValue = 'mouse';
        }
        updateLockedDisplay();
        
        lastFinalCPS = 0;
        lastClickTotal = 0;
        lastRatingHTML = '';
        
        clickDisplay.innerText = "0";
        timerDisplay.innerText = testDurationSec.toFixed(2);
        cpsDisplay.innerText = "0.00";
        
        let lockMsg = (initialInputType === 'keyboard') ? `锁定键: ${initialKeyValue === ' ' ? 'Space' : initialKeyValue.toUpperCase()}` : '锁定鼠标点击';
        resultMsgDiv.innerHTML = `⚡ 测试进行中！ 已${lockMsg}，只有该键/鼠标点击会计数，其他键无效 ⚡`;
        
        startTimestamp = performance.now();
        isTesting = true;
        
        clickZone.classList.remove('disabled');
        zoneStatusMsg.innerHTML = `🔥 狂按【${lockedInputType === 'keyboard' ? (lockedKeyValue === ' ' ? 'Space' : lockedKeyValue.toUpperCase()) : '鼠标'}】！测试中 🔥`;
        enableDurationChips(false);
        
        function refreshLoop() {
            if (!isTesting) {
                if (animationFrameId) animationFrameId = null;
                return;
            }
            updateUI();
            const nowPerf = performance.now();
            const elapsedChk = (nowPerf - startTimestamp) / 1000;
            if (elapsedChk >= testDurationSec && isTesting) {
                endTestWithCooldown();
                if (animationFrameId) cancelAnimationFrame(animationFrameId);
                animationFrameId = null;
                return;
            }
            animationFrameId = requestAnimationFrame(refreshLoop);
        }
        refreshLoop();
    }
    
    // 核心：尝试记录点击（根据锁定规则）
    function tryRegisterClick(inputType, keyValue = null) {
        // 冷却期禁止任何计数
        if (isCooldown) {
            if (lastRatingHTML) {
                resultMsgDiv.innerHTML = `
                    <div style="display:flex; flex-direction:column; gap:6px;">
                        <div>🎉 上一次测试结果 🎉</div>
                        ${lastRatingHTML}
                        <div style="font-size:0.75rem; margin-top:6px;">⏰ 冷却中，请稍等再开始新测试</div>
                    </div>
                `;
            } else {
                resultMsgDiv.innerHTML = '⏰ 冷却中，请稍等片刻再开始新测试。';
            }
            clickZone.style.transform = 'scale(0.98)';
            setTimeout(() => { if(clickZone) clickZone.style.transform = ''; }, 120);
            return false;
        }
        
        // 情况1: 测试进行中 -> 必须符合锁定规则才计数
        if (isTesting) {
            // 没有锁定理论上不可能（开始测试时立即锁定），但防御
            if (!isLocked) {
                // 异常情况：重新锁定为当前输入
                isLocked = true;
                lockedInputType = inputType;
                lockedKeyValue = (inputType === 'keyboard') ? keyValue : 'mouse';
                updateLockedDisplay();
                zoneStatusMsg.innerHTML = `🔥 狂按【${lockedInputType === 'keyboard' ? (lockedKeyValue === ' ' ? 'Space' : lockedKeyValue.toUpperCase()) : '鼠标'}】！测试中 🔥`;
            }
            
            let isValid = false;
            if (lockedInputType === 'keyboard' && inputType === 'keyboard' && keyValue === lockedKeyValue) {
                isValid = true;
            } else if (lockedInputType === 'mouse' && inputType === 'mouse') {
                isValid = true;
            }
            
            if (isValid) {
                clickCount++;
                clickDisplay.innerText = clickCount;
                updateUI();
                clickZone.style.transform = 'scale(0.97)';
                setTimeout(() => { if(clickZone) clickZone.style.transform = ''; }, 70);
                return true;
            } else {
                // 无效按键提示
                let expected = (lockedInputType === 'keyboard') ? `键【${lockedKeyValue === ' ' ? 'Space' : lockedKeyValue.toUpperCase()}】` : '鼠标点击';
                let got = (inputType === 'keyboard') ? `键【${keyValue === ' ' ? 'Space' : keyValue.toUpperCase()}】` : '鼠标点击';
                resultMsgDiv.innerHTML = `⚠️ 当前测试已锁定 ${expected}，你按了 ${got}，本次无效！请使用正确的键继续狂按。`;
                setTimeout(() => {
                    if (!isTesting && !isCooldown) return;
                    if (isTesting && resultMsgDiv.innerHTML.includes('无效')) {
                        resultMsgDiv.innerHTML = `⚡ 测试进行中！ 已锁定${expected}，继续狂按！ ⚡`;
                    }
                }, 800);
                clickZone.style.transform = 'scale(0.98)';
                setTimeout(() => { if(clickZone) clickZone.style.transform = ''; }, 150);
                return false;
            }
        }
        
        // 情况2: 空闲状态且不在冷却 -> 开始新测试，第一个按下的键/鼠标就是锁定的键
        if (!isTesting && !isCooldown) {
            let firstKey = (inputType === 'keyboard') ? keyValue : null;
            startNewTest(inputType, firstKey);
            return true;
        }
        return false;
    }
    
    // 鼠标点击处理
    function onMouseZoneClick() {
        tryRegisterClick('mouse', null);
    }
    
    // 键盘全局处理
    function onGlobalKeyDown(event) {
        // 防止页面刷新和特殊组合
        if (event.key === 'F5' || (event.ctrlKey && event.key === 'r') || (event.ctrlKey && event.key === 'R')) {
            event.preventDefault();
            return;
        }
        // 修饰键本身无效
        const key = event.key;
        if (key === 'Control' || key === 'Alt' || key === 'Shift' || key === 'Meta' || key === 'AltGraph') {
            return;
        }
        event.preventDefault();  // 避免空格滚动、字母输入
        
        // 传递键值 (原始key)
        tryRegisterClick('keyboard', key);
    }
    
    // 重置全状态
    function fullReset() {
        if (animationFrameId) {
            cancelAnimationFrame(animationFrameId);
            animationFrameId = null;
        }
        if (cooldownTimer) {
            clearTimeout(cooldownTimer);
            cooldownTimer = null;
        }
        isTesting = false;
        isCooldown = false;
        clickCount = 0;
        testDurationSec = selectedDuration;
        isLocked = false;
        lockedInputType = null;
        lockedKeyValue = null;
        lastFinalCPS = 0;
        lastClickTotal = 0;
        lastRatingHTML = '';
        
        clickDisplay.innerText = "0";
        timerDisplay.innerText = testDurationSec.toFixed(2);
        cpsDisplay.innerText = "0.00";
        
        clickZone.classList.remove('disabled');
        zoneStatusMsg.innerHTML = '⚡ 按任意键 或 点击开始测试 ⚡';
        resultMsgDiv.innerHTML = '🔄 已重置，按任意键或点击中央区域开始新测试。第一个按下的键/鼠标将被锁定，后续只有使用相同方式才会计数。';
        enableDurationChips(true);
        updateLockedDisplay();
        
        durationPills.forEach(pill => {
            const durVal = parseInt(pill.getAttribute('data-dur'), 10);
            if (durVal === selectedDuration) {
                pill.classList.add('active');
            } else {
                pill.classList.remove('active');
            }
        });
    }
    
    function enableDurationChips(enable) {
        durationPills.forEach(pill => {
            if (enable) {
                pill.classList.remove('disabled-pill');
                pill.style.pointerEvents = 'auto';
                pill.style.cursor = 'pointer';
            } else {
                pill.classList.add('disabled-pill');
                pill.style.pointerEvents = 'none';
                pill.style.cursor = 'default';
            }
        });
    }
    
    function setDuration(seconds) {
        if (isTesting || isCooldown) return;
        selectedDuration = seconds;
        testDurationSec = seconds;
        durationPills.forEach(pill => {
            const durVal = parseInt(pill.getAttribute('data-dur'), 10);
            if (durVal === seconds) {
                pill.classList.add('active');
            } else {
                pill.classList.remove('active');
            }
        });
        timerDisplay.innerText = testDurationSec.toFixed(2);
        if (!isTesting && !isCooldown && !lastRatingHTML) {
            clickDisplay.innerText = "0";
            cpsDisplay.innerText = "0.00";
            resultMsgDiv.innerHTML = `⏱️ 时长设为 ${seconds} 秒，按任意键或点击开始（首个按下的键将锁定）。`;
        }
    }
    
    function bindEvents() {
        clickZone.addEventListener('click', onMouseZoneClick);
        resetBtn.addEventListener('click', fullReset);
        window.addEventListener('keydown', onGlobalKeyDown);
        durationPills.forEach(pill => {
            pill.addEventListener('click', (e) => {
                e.stopPropagation();
                if (isTesting || isCooldown) return;
                const dur = parseInt(pill.getAttribute('data-dur'), 10);
                if (!isNaN(dur)) setDuration(dur);
            });
        });
    }
    
    function init() {
        selectedDuration = 5;
        testDurationSec = 5;
        isTesting = false;
        isCooldown = false;
        clickCount = 0;
        isLocked = false;
        timerDisplay.innerText = "5.0";
        clickDisplay.innerText = "0";
        cpsDisplay.innerText = "0.00";
        clickZone.classList.remove('disabled');
        zoneStatusMsg.innerHTML = '⚡ 按任意键 或 点击开始测试 ⚡';
        resultMsgDiv.innerHTML = '💡 规则：测试开始后，你按下的「第一个键」将被锁定，后续只有按同一个键才会计数。鼠标点击同理。';
        enableDurationChips(true);
        updateLockedDisplay();
        durationPills.forEach(p => {
            if (parseInt(p.getAttribute('data-dur'),10) === 5) p.classList.add('active');
            else p.classList.remove('active');
        });
        bindEvents();
    }
    
    init();
</script>
</body>
</html>
